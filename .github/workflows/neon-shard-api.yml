name: Neon-shard

on:
  push:
    branches:
      - main
      - "feature/neon-shard-*"
    paths:
      - "neon-shard-api/**"
      - "neon-shard/**"
      - ".github/workflows/neon-shard-api.yml"
  pull_request:
    paths:
      - "neon-shard-api/**"
      - "neon-shard/**"
      - ".github/workflows/neon-shard-api.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支連續推送時，取消還沒跑完的舊執行
concurrency:
  group: neon-shard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────── 後端：neon-shard-api ─────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-shard-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1 # 與 package.json 的 engines（>=24.22.1）一致
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  # ───────────── 前端：neon-shard（測試 + 建置）─────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-shard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install dependencies (esbuild)
        run: npm install --no-audit --no-fund
      - name: Syntax check every module
        run: find js -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Import / undefined-name check
        run: npm run check
      # 倉庫裡提交的 dist/ 若比原始碼舊，只警告不擋下
      - name: Warn if the committed dist/ is stale
        run: npm run check:dist || echo "::warning title=dist/ 是舊的::倉庫裡提交的 dist/ 與原始碼不一致。若網站直接使用倉庫中的 dist/，請在本機執行 npm run build 後一併提交。"
      - name: Build (dist/ and index.html)
        run: npm run build
      - name: Verify the fresh build contains every status effect
        run: npm run check:dist
