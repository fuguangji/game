name: Neon-shard API

on:
  push:
    branches:
      - main
      - feature/neon-shard-api
    paths:
      - "neon-shard-api/**"
      - ".github/workflows/neon-shard-api.yml"
  pull_request:
    paths:
      - "neon-shard-api/**"
      - ".github/workflows/neon-shard-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-shard-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
