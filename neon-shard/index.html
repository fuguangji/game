<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <title>NEON SHARD</title>
    <link rel="stylesheet" href="css/account-features.css?v=2" />
    <link rel="stylesheet" href="css/profile.css?v=1" />
    <style>
      :root {
        --bg: #060812;
        --c: #22e6ff;
        --t: #d8f4ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--t);
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, "Noto Sans TC", sans-serif;
      }
      #g {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #sa {
        position: fixed;
        top: 0;
        left: 0;
        padding-top: env(safe-area-inset-top, 0px);
        visibility: hidden;
      }
      .sec {
        margin: 12px 0 6px;
        font-size: 12px;
        letter-spacing: 2px;
        color: #ff3d9a;
      }
      #fs {
        position: fixed;
        z-index: 20;
        left: max(calc(10px * var(--u, 1)), env(safe-area-inset-left));
        bottom: max(calc(10px * var(--u, 1)), env(safe-area-inset-bottom));
        width: calc(42px * var(--u, 1));
        height: calc(42px * var(--u, 1));
        border: 1px solid #22e6ff77;
        border-radius: 10px;
        background: #05060d99;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .tb {
        position: fixed;
        z-index: 5;
        display: none;
        border-radius: 50%;
        border: 2px solid;
        background: #05060d99;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font: 700 calc(11px * var(--u, 1)) system-ui;
        letter-spacing: 1px;
        touch-action: none;
      }
      #bS {
        right: calc(max(0px, env(safe-area-inset-right)) + 138px * var(--u, 1));
        bottom: calc(
          max(0px, env(safe-area-inset-bottom)) + 156px * var(--u, 1)
        );
        width: calc(68px * var(--u, 1));
        height: calc(68px * var(--u, 1));
        color: #ffe14a;
        border-color: #ffe14a;
        opacity: 0.45;
      }
      #bS.r {
        opacity: 1;
        box-shadow: 0 0 18px #ffe14a;
      }
      #bD {
        right: calc(max(0px, env(safe-area-inset-right)) + 182px * var(--u, 1));
        bottom: calc(
          max(0px, env(safe-area-inset-bottom)) + 62px * var(--u, 1)
        );
        width: calc(58px * var(--u, 1));
        height: calc(58px * var(--u, 1));
        color: #22e6ff;
        border-color: #22e6ff;
      }
      #bW {
        display: none !important;
        right: max(92px, calc(env(safe-area-inset-right) + 88px));
        bottom: max(30px, calc(env(safe-area-inset-bottom) + 24px));
        width: 54px;
        height: 54px;
        color: #ffb03d;
        border-color: #ffb03d;
        font-size: 12px;
      }
      .wb {
        border: 1px solid #ffffff22;
        border-radius: 8px;
        padding: 5px 7px;
        cursor: pointer;
      }
      .wb.s {
        border-color: var(--wc);
        background: #ffffff14;
        box-shadow: 0 0 8px var(--wc);
      }
      .wb small {
        opacity: 0.65;
        font-size: 11px;
      }
      .wb em {
        margin-left: auto;
        font-style: normal;
        font-weight: 700;
        color: var(--wc);
      }
      .tb.on {
        display: flex;
      }
      @media (orientation: portrait) {
        #bS {
          right: calc(
            max(0px, env(safe-area-inset-right)) + 14px * var(--u, 1)
          );
          bottom: calc(
            max(0px, env(safe-area-inset-bottom)) + 262px * var(--u, 1)
          );
        }
        #bD {
          right: calc(
            max(0px, env(safe-area-inset-right)) + 20px * var(--u, 1)
          );
          bottom: calc(
            max(0px, env(safe-area-inset-bottom)) + 190px * var(--u, 1)
          );
        }
      }
      .sb {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ffd23a88;
        background: #ffd23a14;
        color: #ffd23a;
        font-size: 14px;
        cursor: pointer;
      }
      .sb:disabled {
        opacity: 0.35;
      }
      .hint {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 8px;
      }
      #tr {
        position: fixed;
        z-index: 7;
        left: 50%;
        top: max(46px, calc(env(safe-area-inset-top) + 40px));
        transform: translateX(-50%);
        width: min(96vw, 800px);
        background: #05060ddd;
        border: 1px solid #22e6ff66;
        border-radius: 12px;
        padding: 6px 8px;
        font-size: 11px;
        touch-action: none;
      }
      #tr.h,
      #trt.h {
        display: none;
      }
      #tr .tg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin-bottom: 6px;
      }
      #tr .sec {
        margin: 6px 0 4px;
      }
      #tr button {
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid;
        border-radius: 8px;
        background: #ffffff0d;
        color: var(--t);
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }
      .tr-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .tr-l {
        flex: none;
        width: 46px;
        font-size: 11px;
        color: #ff3d9a;
        letter-spacing: 1px;
      }
      .tr-b {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        flex: 1;
        padding-bottom: 3px;
        scrollbar-width: thin;
        touch-action: pan-x;
      }
      #trt {
        position: fixed;
        z-index: 7;
        left: calc(max(10px, env(safe-area-inset-left)) + 48px);
        top: max(10px, env(safe-area-inset-top));
        height: 38px;
        padding: 0 12px;
      }
      #aa {
        position: fixed;
        z-index: 20;
        left: calc(
          max(calc(10px * var(--u, 1)), env(safe-area-inset-left)) + 52px *
            var(--u, 1)
        );
        bottom: max(calc(10px * var(--u, 1)), env(safe-area-inset-bottom));
        height: calc(42px * var(--u, 1));
        padding: 0 calc(12px * var(--u, 1));
        border: 1px solid #ffe14a88;
        border-radius: 10px;
        background: #05060d99;
        color: #ffe14a;
        font-size: calc(12px * var(--u, 1));
        cursor: pointer;
        display: none;
      }
      #aa.off {
        color: #9aa;
        border-color: #9aa8;
      }
      #qt {
        position: fixed;
        z-index: 6;
        left: max(calc(10px * var(--u, 1)), env(safe-area-inset-left));
        top: max(calc(10px * var(--u, 1)), env(safe-area-inset-top));
        width: calc(38px * var(--u, 1));
        height: calc(38px * var(--u, 1));
        border: 1px solid #22e6ff77;
        border-radius: 10px;
        background: #05060d99;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .chw {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .chp {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 9px;
        border: 1px solid #ffffff22;
        border-radius: 999px;
        font-size: 12px;
        cursor: pointer;
        background: #ffffff08;
      }
      .chp.on {
        border-color: var(--wc);
        background: #ffffff18;
        box-shadow: 0 0 8px var(--wc);
      }
      .chp .pips {
        display: flex;
        gap: 2px;
        margin-left: 2px;
      }
      .chp .pips i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1px solid #ffffff44;
      }
      .chp .ord {
        font-size: 10px;
        background: var(--wc);
        color: #05060d;
        border-radius: 8px;
        padding: 0 5px;
        font-weight: 700;
      }
      .chsl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .chs {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--rc);
        border-radius: 10px;
        min-height: 62px;
        cursor: pointer;
        background: #ffffff08;
      }
      .chs.em {
        border-style: dashed;
      }
      .chs.on {
        box-shadow:
          0 0 0 2px var(--rc),
          0 0 14px var(--rc);
        background: #ffffff14;
      }
      .chn {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--rc);
        color: #05060d;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chb {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }
      .chb b {
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chb small {
        font-size: 11px;
        opacity: 0.72;
        line-height: 1.35;
      }
      .chb .chsub {
        color: #ff9a3d;
        opacity: 1;
      }
      .chr {
        font-size: 10px;
        padding: 0 6px;
        border-radius: 6px;
        border: 1px solid var(--rc);
        color: var(--rc);
        font-weight: 700;
      }
      .chx {
        flex: none;
        background: #ffffff14;
        border: 1px solid #ffffff33;
        color: var(--t);
        border-radius: 6px;
        font-size: 11px;
        padding: 3px 7px;
        cursor: pointer;
      }
      .chst {
        margin-top: 10px;
        border: 1px solid #ffffff1a;
        border-radius: 10px;
        padding: 8px 10px;
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 4px 10px;
        font-size: 12px;
        align-items: center;
        background: #ffffff06;
      }
      .chst .l {
        opacity: 0.75;
      }
      .chst .v {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .chst .v.up {
        color: #4dff88;
        font-weight: 700;
      }
      .chst .v.dn {
        color: #ff6a6a;
        font-weight: 700;
      }
      .chlg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 11px;
        margin-top: 2px;
      }
      .chg {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 12px 0 6px;
        font-size: 13px;
        letter-spacing: 1px;
        border-bottom: 1px solid currentColor;
        padding-bottom: 3px;
      }
      .chg small {
        opacity: 0.7;
        font-size: 11px;
        letter-spacing: 0;
      }
      .chgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 6px;
      }
      .chc {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid var(--rc);
        border-left-width: 4px;
        border-radius: 8px;
        cursor: pointer;
        background: #ffffff08;
        font-size: 12px;
      }
      .chc.dim {
        opacity: 0.5;
      }
      .chc.on {
        background: #ffffff1c;
      }
      .chc.r3 {
        box-shadow: 0 0 8px #c060ff66;
      }
      .chc.r4 {
        animation: chglow 2.2s ease-in-out infinite;
      }
      @keyframes chglow {
        0%,
        100% {
          box-shadow: 0 0 4px var(--rc);
        }
        50% {
          box-shadow: 0 0 16px var(--rc);
        }
      }
      .chc em {
        margin-left: auto;
        font-style: normal;
        font-weight: 700;
        font-size: 12px;
        color: var(--rc);
      }
      .chpk {
        display: grid;
        gap: 8px;
      }
      .chpack {
        border: 1px solid var(--wc);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        background: #ffffff08;
      }
      .chpack.dim {
        opacity: 0.5;
      }
      .chpack .top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .chpack .top small {
        opacity: 0.7;
        font-size: 11px;
      }
      .chpack .top em {
        margin-left: auto;
        font-style: normal;
        font-weight: 700;
      }
      .chpack .odds {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        font-size: 11px;
        margin-top: 4px;
      }
      .hint.warn {
        color: #ff9a3d;
        opacity: 1;
      }
      #cts {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 54px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }
      @keyframes chin {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
      }
      @keyframes chout {
        to {
          opacity: 0;
        }
      }
      /* ===== NEON SHARD · 新版選單系統 ===== */
      :root {
        --p0: #070a19;
        --p1: #0d1328;
        --p2: #141c3b;
        --p3: #1d284e;
        --ln: #28336a;
        --m: #ff3d9a;
        --g: #ffd23a;
        --mu: #8795c4;
        --cut: polygon(
          0 0,
          calc(100% - 10px) 0,
          100% 10px,
          100% 100%,
          10px 100%,
          0 calc(100% - 10px)
        );
      }
      #ov,
      #sh,
      #ps {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        overflow: hidden;
      }
      #ov.h,
      #sh.h,
      #ps.h {
        display: none;
      }
      #ov {
        background:
          radial-gradient(900px 520px at 10% -12%, #17336e66, transparent 70%),
          repeating-linear-gradient(
            118deg,
            transparent 0 60px,
            #22e6ff08 60px 61px
          ),
          var(--bg);
      }
      .x-app {
        display: flex;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      .x-rail {
        flex: none;
        width: 80px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: max(10px, env(safe-area-inset-top, 0px)) 6px
          max(10px, env(safe-area-inset-bottom, 0px));
        background: var(--p0);
        box-shadow: inset -1px 0 0 var(--ln);
      }
      .x-logo {
        display: flex;
        justify-content: center;
        padding: 2px 0 10px;
      }
      .x-tab {
        position: relative;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 56px;
        border: 0;
        background: none;
        color: var(--mu);
        font: 600 12px/1 inherit;
        font-family: inherit;
        cursor: pointer;
        padding: 0;
      }
      .x-tab svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .x-tab.on {
        color: var(--c);
        background: linear-gradient(90deg, #22e6ff26, transparent);
      }
      .x-tab.on::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 3px;
        background: var(--c);
      }
      .x-main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .x-top {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: max(10px, env(safe-area-inset-top, 0px)) 14px 8px;
      }
      .x-ttl {
        flex: 1;
        min-width: 0;
      }
      .x-ttl b {
        display: block;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .x-ttl small {
        display: block;
        font-size: 12px;
        color: var(--mu);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .x-cur {
        display: flex;
        gap: 6px;
      }
      .x-cur span {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        background: var(--p2);
        font-weight: 700;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        clip-path: polygon(
          0 0,
          calc(100% - 7px) 0,
          100% 7px,
          100% 100%,
          7px 100%,
          0 calc(100% - 7px)
        );
      }
      #go {
        flex: none;
        height: 42px;
        padding: 0 28px 0 32px;
        border: 0;
        background: var(--c);
        color: #04101a;
        font: 800 16px/1 inherit;
        font-family: inherit;
        letter-spacing: 0.14em;
        cursor: pointer;
        clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
      }
      .x-app[data-t="h"] #go {
        display: none;
      }
      body.inmenu #fs {
        display: none;
      }
      .x-ib {
        flex: none;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: var(--p2);
        cursor: pointer;
        clip-path: polygon(
          0 0,
          calc(100% - 8px) 0,
          100% 8px,
          100% 100%,
          8px 100%,
          0 calc(100% - 8px)
        );
      }
      .x-ib svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: var(--c);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .x-view {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 4px 14px max(14px, env(safe-area-inset-bottom, 0px));
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
      }
      .x-view.fit {
        overflow: hidden;
      }
      .x-split {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 14px;
        height: 100%;
      }
      .x-sc {
        overflow: auto;
        min-height: 0;
        touch-action: pan-y;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
      }
      .x-doc {
        max-width: 780px;
      }
      .x-pn {
        background: var(--p1);
        padding: 14px;
        clip-path: polygon(
          0 0,
          calc(100% - 14px) 0,
          100% 14px,
          100% 100%,
          14px 100%,
          0 calc(100% - 14px)
        );
      }
      .x-h {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 16px 0 8px;
        font-size: 13px;
        font-weight: 700;
        color: var(--mu);
        letter-spacing: 0.04em;
      }
      .x-h:first-child {
        margin-top: 2px;
      }
      .x-h small {
        font-weight: 500;
        font-size: 12px;
        opacity: 0.85;
      }
      .x-lst {
        display: grid;
        gap: 7px;
      }
      .x-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 7px;
      }
      .x-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .x-tx {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }
      .x-tx b {
        font-size: 14px;
        font-weight: 700;
      }
      .x-tx small,
      .x-cd small {
        display: block;
        font-size: 12px;
        color: var(--mu);
        line-height: 1.45;
      }
      .x-ic {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .x-cd {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        border: 0;
        color: var(--t);
        font: inherit;
        background: var(--p1);
        padding: 10px 12px;
        cursor: pointer;
        box-shadow:
          inset 3px 0 0 var(--a, var(--ln)),
          inset 0 0 0 1px #ffffff12;
        clip-path: var(--cut);
      }
      .x-cd.on {
        background: linear-gradient(#ffffff14, #ffffff14), var(--p1);
        box-shadow:
          inset 3px 0 0 var(--a),
          inset 0 0 0 1px var(--a);
      }
      .x-cd.lk {
        opacity: 0.5;
      }
      .x-cd.dim {
        opacity: 0.45;
      }

        .chtoast {
          animation: none;
        }
      }
      .x-elbk {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #02040bd9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      .x-elw {
        width: min(720px, 100%);
        max-height: 94vh;
        overflow: auto;
        background: var(--p1);
        padding: 14px;
        box-shadow: inset 0 0 0 1px #ffffff18;
      }
      .x-elw h3 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      .x-elg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .x-elc {
        padding: 10px;
        background: #080c1c;
        box-shadow: inset 0 0 0 1px var(--a);
      }
      .x-elc.el {
        box-shadow:
          inset 0 0 0 2px #ffb21a,
          0 0 14px #ffb21a88,
          inset 0 0 16px #ffb21a33;
      }
      .x-elc .tp {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--a);
      }
      .x-elc.el .tp {
        color: #ffb21a;
      }
      .x-elc b {
        display: block;
        font-size: 15px;
        margin: 6px 0 2px;
      }
      .x-elc .st {
        font-size: 12px;
        color: var(--mu);
        margin-bottom: 6px;
      }
      .x-elc p,
      .x-elc li {
        font-size: 12px;
        line-height: 1.55;
        color: #bcc8ee;
        margin: 4px 0;
      }
      .x-elc ul {
        padding-left: 16px;
        margin: 4px 0;
      }
      .x-elx {
        margin-top: 10px;
        width: 100%;
        border: 0;
        padding: 10px;
        color: var(--t);
        background: #ffffff14;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 480px) {
        .x-elg {
          gap: 6px;
        }
        .x-elc {
          padding: 8px;
        }
      }
    </style>
  </head>
